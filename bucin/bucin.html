<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bucin</title>
    <style>
        *, html, {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to right, blue, cornflowerblue, aqua);
        }

        .bucin {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img {
            width: 300px;
            height: 300px;
            margin: 0 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: 3s;
        }

        .img:hover {
        }
    </style>
</head>
<body>
    <div class="bucin">
        <img src="assets/sabda.jpeg" alt="img" class="img"/>
        <img src="assets/fauziyah.jpeg" alt="img" class="img"/>
    </div>
</body>
</html>
